[package]
name = "racon-api"
version = "0.1.0"
edition = "2021"
description = "Versioned HTTP API contracts for RACoN"

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-core = "0.3"
racon-core = { path = "../racon-core" }
racon-coverability = { path = "../racon-coverability" }
racon-engine = { path = "../racon-engine" }
racon-reduction = { path = "../racon-reduction" }
racon-runtime = { path = "../racon-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
